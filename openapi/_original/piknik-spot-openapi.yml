components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Session-based authentication for web browsers
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for external applications and AI agents
      flows:
        authorizationCode:
          authorizationUrl: https://piknik.spot/api/oauth/authorize
          tokenUrl: https://piknik.spot/api/oauth/token
          refreshUrl: https://piknik.spot/api/oauth/token
          scopes:
            marketplace:write: Create and manage marketplace listings
            events:write: Create and manage community events
            read:profile: Read user profile information
            write:profile: Update user profile information
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth2 access token (JWT). Include in Authorization header as: Bearer {token}'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        error_description:
          type: string
          description: Detailed error description
    Participant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        primaryRole:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        image:
          type: string
          nullable: true
        status:
          type: string
    Listing:
      type: object
      properties:
        id:
          type: string
        participantId:
          type: string
        listingType:
          type: string
          enum:
          - wanted_to_sell
          - wanted_to_buy
          - service_offering
        title:
          type: string
        description:
          type: string
        quantity:
          type: string
          nullable: true
        contactMethod:
          type: string
          enum:
          - email
          - phone
          - message
        radiusKm:
          type: number
        endDate:
          type: string
          format: date
        wantedInReturn:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateListingRequest:
      type: object
      required:
      - participant_id
      - listing_type
      - title
      - description
      - contact_method
      - end_date
      properties:
        participant_id:
          type: string
          description: ID of the business creating the listing (get from /api/v2/participants/my-businesses)
        listing_type:
          type: string
          enum:
          - wanted_to_sell
          - wanted_to_buy
          - service_offering
        title:
          type: string
          maxLength: 200
        description:
          type: string
        quantity:
          type: string
          nullable: true
        contact_method:
          type: string
          enum:
          - email
          - phone
          - message
        radius_km:
          type: number
          default: 50
        end_date:
          type: string
          format: date
          description: 'ISO date format: YYYY-MM-DD'
        wanted_in_return:
          type: string
          nullable: true
        association_ids:
          type: array
          items:
            type: string
    Event:
      type: object
      properties:
        id:
          type: string
        participantId:
          type: string
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        address:
          type: string
        locationName:
          type: string
          nullable: true
        eventType:
          type: string
        isRecurring:
          type: boolean
        recurrenceRule:
          type: string
          nullable: true
    CreateEventRequest:
      type: object
      required:
      - participant_id
      - title
      - description
      - start_date
      - end_date
      - address
      properties:
        participant_id:
          type: string
          description: ID of the business creating the event
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
          description: ISO 8601 format
        end_date:
          type: string
          format: date-time
          description: ISO 8601 format
        address:
          type: string
        location_name:
          type: string
          nullable: true
        event_type:
          type: string
          enum:
          - market
          - workshop
          - tour
          - festival
          - meeting
          - other
        is_recurring:
          type: boolean
          default: false
        recurrence_rule:
          type: string
          nullable: true
          description: iCal recurrence rule (e.g., FREQ=WEEKLY;BYDAY=SA)
        registration_url:
          type: string
          format: uri
          nullable: true
