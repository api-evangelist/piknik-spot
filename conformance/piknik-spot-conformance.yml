domain_standard:
  market: local food systems / agri-food directories
  finding: >-
    No sector data standard is declared in the contract (no Open Food Network / DFC "Data Food
    Consortium" ontology, no GS1, no schema.org FoodEstablishment markup in the API), and the sector
    has no regulator-mandated interchange standard, so nothing is asserted here. The only
    cross-domain standard the contract itself declares is iCalendar RRULE (above). Reward-only field;
    honest absence.
