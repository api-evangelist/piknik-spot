core_graph_note: 'Participant (a place) is the hub: Listings, Events, Offerings, ServiceLocations, Jobs, Reviews, Tasks and
  Users hang off it; Connections link Participants to Participants (supplier -> buyer) and are the edges the Local Food Score
  is computed over (only FARM-supplier links count today, per the MCP SKILL.md). Terms of Service 7A names these entity relationships
  as the proprietary core of the dataset.'
