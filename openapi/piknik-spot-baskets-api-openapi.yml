  /baskets:
    post:
      summary: Create or upsert a basket
      tags:
      - Baskets
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: creatorId
        in: query
        schema:
          type: string
        description: creatorId parameter
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      operationId: postBaskets
      x-operation-id-source: derived
    get:
      summary: Create or upsert a basket
      tags:
      - Baskets
      responses:
        '200':
          description: Success
          content:
