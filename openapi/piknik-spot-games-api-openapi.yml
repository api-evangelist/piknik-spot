  /games/random-local-spot:
    get:
      summary: GET /games/random-local-spot
      description: Endpoint for /games/random-local-spot
      tags:
      - Games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
