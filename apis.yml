- name: Piknik.Spot A2A Agent
  description: >-
    Agent-to-Agent (A2A 1.0) agent served from the provider's own host: the agent card at /.well-known/agent-card.json
    (also at the legacy /.well-known/agent.json, byte-identical) declares five public skills (search local
    food places, get a public place summary, search marketplace listings, search events, search jobs)
    over a JSON-RPC binding at https://piknik.spot/api/a2a. Anonymous message/send works for public search;
    the extended agent card and additional skills require a bearer token (pik_pat_ or OAuth JWT). Per-place
    and per-association agent cards are also exposed under /api/agents/participant/{id}/card and /api/agents/association/{id}/card.
  humanURL: https://piknik.spot/.well-known/agent-card.json
  baseURL: https://piknik.spot/api/a2a
