- name: Piknik.Spot MCP Server
  description: Hosted, remote Model Context Protocol server (protocol 2025-03-26, Streamable HTTP with an SSE endpoint
    at /api/mcp/sse) exposing 62 tools and 7 piknik:// resources for local-food discovery, Local Food Score analysis,
    marketplace listings, events, jobs, recipes, products and pack prices, service locations, supplier-buyer connections,
    associations and walking tours. tools/list, initialize, prompts/list and resources/list answer anonymously;
    write tools return a JSON-RPC -32001 error with a WWW-Authenticate Bearer challenge pointing at RFC 9728 protected-resource
    metadata until the client authorizes via OAuth 2.0 (authorization code + PKCE, dynamic client registration)
    or presents a pik_pat_ personal access token.
  humanURL: https://piknik.spot/skills/piknik-mcp/SKILL.md
