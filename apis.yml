aid: piknik-spot
name: Piknik.Spot
description: 'Piknik (piknik.spot) is a local food system platform based in Waterloo Region, Ontario, Canada that
  maps farms, processors, markets, shops, restaurants, community gardens and food hubs, the supply links between
  them, marketplace listings, community events, jobs and volunteer posts, recipes, and a Local Food Score for any
  address. It is built agent-first: a REST API under https://piknik.spot/api described by a 683-operation OpenAPI
  3.0.3 document, a hosted Model Context Protocol server at https://piknik.spot/api/mcp exposing 62 tools (public
  discovery tools anonymously, write tools behind OAuth 2.0 with PKCE and dynamic client registration or pik_pat_
  personal access tokens), an A2A 1.0 agent card served at /.well-known/agent-card.json with a JSON-RPC endpoint
  at /api/a2a, an llms.txt, provider-published Agent Skills, and a published Agent Ethics policy that permits only
  immediate-use access and forbids bulk extraction, retention and model training.'
image: https://piknik.spot/icons/icon-512x512.png
