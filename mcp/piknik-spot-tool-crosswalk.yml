source: Derived by aligning the LIVE MCP tools/list (62 tools, anonymous, mcp/piknik-spot-mcp-tools-list.json) with the provider-hosted
  OpenAPI (openapi/_original/piknik-spot-openapi.json, 509 paths / 683 operations). Every REST reference below was verified
  to exist as a METHOD + path in that spec.
purpose: 'Make each MCP tool a first-class discovery unit bound to its backing REST operation(s). Piknik''s REST, MCP and
  A2A surfaces are overlapping-but-divergent projections of one data core: two tools have no REST counterpart, and 610 of
  683 REST operations have no tool.'
binding_key_note: The provider's OpenAPI declares NO operationId on any of its 683 operations, so rest[] entries are "METHOD
  /path" strings (paths relative to https://piknik.spot/api) rather than operationIds. overlays/piknik-spot-openapi-overlay.yaml
  proposes stable operationIds; this file deliberately keys on what the provider actually published.
