overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Piknik.Spot OpenAPI
  version: '2026-09-19'
  description: 'Generated 2026-09-19 (method: generated). Applies on top of openapi/piknik-spot-openapi.yml WITHOUT mutating
    it. Proposes a stable operationId for every one of the 683 operations (the source declares none), removes the localhost
    development server, links the agent surfaces the provider publishes, and documents the place-summary rate limit observed
    live. Parameter names for place-summary come from llms.txt and the live 400 body.'
extends: openapi/piknik-spot-openapi.yml
actions:
- target: $.servers
  description: Drop the http://localhost:3000/api development server from the consumer-facing view; the production server
    is the only one an agent can call.
  update: null
- target: $.servers[?(@.url=='http://localhost:3000/api')]
  description: Remove the development server entry.
  remove: true
- target: $.info
  description: Add the machine-discoverable agent surfaces the provider publishes but the spec omits.
  update:
    termsOfService: https://piknik.spot/terms-of-service
    x-llms-txt: https://piknik.spot/llms.txt
    x-agent-card: https://piknik.spot/.well-known/agent-card.json
    x-mcp-endpoint: https://piknik.spot/api/mcp
    x-agent-ethics: https://piknik.spot/.well-known/agent-ethics.md
    x-oauth-authorization-server: https://piknik.spot/.well-known/oauth-authorization-server
    x-oauth-protected-resource: https://piknik.spot/.well-known/oauth-protected-resource
