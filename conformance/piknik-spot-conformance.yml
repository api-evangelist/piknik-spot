  - id: oauth2-pkce
    conforms: true
    evidence: code_challenge_methods_supported [S256, plain] in the authorization-server metadata.
  - id: rfc8414-authorization-server-metadata
    conforms: true
    evidence: /.well-known/oauth-authorization-server returns valid metadata with issuer https://piknik.spot (200, 902 bytes).
  - id: rfc9728-protected-resource-metadata
    conforms: true
    evidence: /.well-known/oauth-protected-resource returns resource https://piknik.spot/api/mcp with authorization_servers and scopes_supported (200); a live 401 from tools/call carries WWW-Authenticate Bearer resource_metadata="..." pointing at it.
  - id: rfc7591-dynamic-client-registration
    conforms: true
    evidence: registration_endpoint https://piknik.spot/api/oauth/register in the RFC 8414 document; OpenAPI summary on POST /oauth/register reads "Dynamic Client Registration (DCR) endpoint per RFC 7591".
  - id: rfc7009-token-revocation
    conforms: true
    evidence: revocation_endpoint https://piknik.spot/api/oauth/revoke with revocation_endpoint_auth_methods_supported in the RFC 8414 document; POST /oauth/revoke in the OpenAPI.
  - id: rfc6750-bearer-token
    conforms: true
