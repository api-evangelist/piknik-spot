apis:
- name: Piknik.Spot REST API
  description: REST API under https://piknik.spot/api covering participants (places), offerings and pack prices,
    service locations, marketplace listings, events and RSVPs, jobs, recipes, associations and place tours, CSA
    interests, spend challenges, delivery tasks, geocoding, the Local Food Score, OAuth 2.0 client management and
    an unauthenticated public place-summary endpoint for AI agents (max 5 results, 30 requests per minute). Described
    by a provider-hosted OpenAPI 3.0.3 document with 509 paths and 683 operations; the same document is served as
    YAML at /api/openapi. Authentication is an OAuth 2.0 bearer JWT or a pik_pat_ personal access token; browser
    sessions use a next-auth cookie.
  humanURL: https://piknik.spot/api/docs
