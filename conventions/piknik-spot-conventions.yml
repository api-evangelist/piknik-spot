method: searched
source: >-
  openapi/_original/piknik-spot-openapi.json (683 operations; parameter-name census) + live
  unauthenticated responses on 2026-09-19 + https://piknik.spot/skills/piknik-rest-api/SKILL.md +
  https://piknik.spot/skills/piknik-mcp/SKILL.md + https://piknik.spot/.well-known/agent-ethics.md.
summary: >-
  Cross-cutting semantics for the Piknik REST API, MCP server and A2A endpoint. The REST surface is
  a Next.js route handler API: JSON in/out, offset-or-page pagination by query parameter, bearer JWT
  or pik_pat_ token, a two-field error envelope, and no idempotency-key, request-id, versioning or
  field-selection mechanism. The MCP server adds JSON-RPC semantics and per-tool auth tiers.
authentication:
  styles: [oauth2_bearer_jwt, personal_access_token_bearer, session_cookie]
  bearer_header: 'Authorization: Bearer <OAuth JWT | pik_pat_...>'
  cookie: next-auth.session-token (browser sessions only)
  scopes: [marketplace:write, events:write, read:profile, write:profile]
  see: authentication/piknik-spot-authentication.yml, scopes/piknik-spot-scopes.yml
  note: 441 of 683 operations declare bearerAuth OR cookieAuth; 242 declare security [] (public), including the agent, oauth, geocode and place-summary endpoints.
idempotency:
  coverage: partial
  documented: true
  header: null
  mechanism: natural-key duplicate suppression on one operation
  scope:
    - create_product (MCP) / POST /v2/participants/{id}/offerings
  evidence: >-
    The provider's MCP SKILL.md documents create_product as "idempotent — skips duplicates" and that a
    duplicate returns "Already on This Place — no action needed". No Idempotency-Key header or
    parameter exists anywhere in the 683-operation spec (zero matches for "idempoten"); every other
    write — POST /listings, POST /events, POST /jobs, POST /recipes, suggest_place, create_listing,
    create_event — has no replay protection.
  agent_risk: >-
    A retried create after a timeout can duplicate a listing, event, job or recipe. Skills in skills/
    therefore re-run the matching search before any retry.
  pointer_note: 'type: Idempotency is emitted with coverage: partial and the one-operation scope above; it is NOT a surface-wide guarantee.'
reversibility:
  grade: documented
  read_only: false
  write_surface_note: 233 POST, 51 PUT, 25 PATCH and 53 DELETE operations. Piknik does not process payments or transactions (ToS 3, 6), so no financial reversal exists; reversals below are content lifecycle actions.
  reversals:
    - surface: marketplace listing
      create: POST /listings | create_listing
      reverse: DELETE /listings/{id}; POST /listings/{id}/fulfill (close); POST /listings/{id}/reactivate (undo expiry); POST /listings/{id}/decline-acceptance (undo an acceptance)
      window: not stated
      docs: https://piknik.spot/skills/piknik-rest-api/SKILL.md
    - surface: event
      create: POST /events | create_event
      reverse: DELETE /events/{id}; update_event with status (MCP) / PUT /events/{id}
      window: not stated
    - surface: event RSVP
      create: POST /events/{id}/rsvp
      reverse: DELETE /events/{id}/rsvp
      window: not stated
    - surface: job posting
      create: POST /jobs | create_job
      reverse: DELETE /jobs/{jobId}; update_job with status CANCELLED / FILLED (MCP SKILL.md)
      window: not stated
    - surface: recipe
      create: POST /recipes | create_recipe
      reverse: DELETE /recipes/{id} | delete_recipe ("Permanently delete")
      window: not stated
    - surface: pack price
      create: POST /v2/participants/{id}/pack-prices | create_pack_price
      reverse: DELETE /v2/participants/{id}/pack-prices/{quoteId} | delete_pack_price ("Permanently delete"); update_pack_price is_active=false (pause, reversible)
      window: not stated
    - surface: delivery task claim
      create: POST /tasks/{id}/claim | claim_delivery_task
      reverse: POST /tasks/{id}/unclaim; POST /tasks/{id}/abandon
      window: not stated
    - surface: event ticket check-in
      create: POST /events/tickets/checkin, POST /agritourism/campaigns/{id}/scanner/checkin
      reverse: POST /agritourism/campaigns/{id}/scanner/undo-checkin
      window: not stated
    - surface: agritourism ticket
      create: POST /agritourism/checkout
      reverse: POST /agritourism/tickets/{id}/cancel
      window: not stated
      note: Ticketing runs on Stripe Connect (/agritourism/stripe-connect); refund terms are not published by Piknik.
    - surface: supplier-buyer connection
      create: apply_connection (admin) / POST /v2/participants/{id}/connections
      reverse: remove_connection (admin) / DELETE /v2/participants/{id}/connections/{connectionId}
      window: not stated
    - surface: user account
      create: signup
      reverse: POST /user/delete-account — anonymizes the account; "Public information already copied or cached by others cannot be removed" (privacy policy)
      window: not stated
  irreversible:
    - suggest_place / suggest_connection / suggest_product submissions (pending admin review; no withdraw operation published)
    - POST /contact, POST /feedback, POST /agents/participant/{id}/send_inquiry (messages sent)
  grading_note: >-
    Every reversal path above is real (present in the contract or the provider's own skill docs) but
    NO window is stated anywhere, so the dimension grades `documented` (0.4), not `verified`. No
    window has been invented.
dry_run_mode:
