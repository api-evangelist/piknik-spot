  /games/match3/scores:
    post:
      summary: POST - Submit a new Match3 score
      tags:
      - Games
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
