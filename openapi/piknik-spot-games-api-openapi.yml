openapi: 3.2.0
info:
  title: Piknik.Spot Games API
  description: Piknik.Spot API with OAuth2 authentication, Model Context Protocol (MCP) support, and Agent-to-Agent (A2A) capabilities for AI-powered local food system interactions.
  version: 1.0.0
  contact:
    name: Piknik.Spot API Support
    url: https://piknik.spot
    email: info@piknik.spot
  license:
    name: Proprietary
    url: https://piknik.spot/terms
servers:
- url: https://piknik.spot/api
  description: Production Server
- url: http://localhost:3000/api
  description: Development Server
tags:
- name: Games
paths:
  /games/{gameId}/leaderboard:
    get:
      summary: GET /games/{gameId}/leaderboard
      description: Endpoint for /games/{gameId}/leaderboard
      tags:
      - Games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
        description: gameId identifier
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of results
      - name: offset
        in: query
        schema:
          type: integer
        description: Pagination offset
      - name: userId
        in: query
        schema:
          type: string
        description: userId parameter
      operationId: getGamesByGameIdLeaderboard
      x-operation-id-source: derived
  /games/{gameId}/participating-businesses:
    get:
      summary: GET /games/{gameId}/participating-businesses
      description: Endpoint for /games/{gameId}/participating-businesses
      tags:
      - Games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
        description: gameId identifier
      operationId: getGamesByGameIdParticipatingBusinesses
      x-operation-id-source: derived
  /games/{gameId}:
    get:
      summary: GET /games/{gameId}
      description: Endpoint for /games/{gameId}
      tags:
      - Games
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
