      security: []
      parameters:
      - name: mode
        in: query
        schema:
          type: string
        description: mode parameter
      - name: level
        in: query
        schema:
          type: string
        description: level parameter
      - name: participantId
        in: query
        schema:
          type: string
        description: Participant identifier
      - name: anonymousUserId
        in: query
        schema:
          type: string
        description: anonymousUserId parameter
      - name: limit
