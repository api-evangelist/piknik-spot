    name: Search local food places
    tags: [local-food, farms, markets]
  - id: get-place-summary
    name: Get a public place summary
    tags: [place]
  - id: search-marketplace-listings
    name: Search marketplace listings
    tags: [marketplace, surplus]
  - id: search-events
    name: Search events
    tags: [events]
  - id: search-jobs
    name: Search jobs
    tags: [jobs]
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT with streaming, pushNotifications and
    extendedAgentCard as fields; protocolVersion "1.0" is present at the top level AND repeated on
    supportedInterfaces[0]; skills is an ARRAY of five fully-populated skills, each with id, name,
    description, tags, examples, inputModes and outputModes. All three optional discriminators are
    also present (preferredTransport, defaultInputModes, defaultOutputModes), so the card is
    conformant rather than near-conformant.
  deviations:
  - field: url / preferredTransport / protocolVersion alongside supportedInterfaces
    observed: the card carries BOTH the 0.3-era top-level triple and the 1.0 supportedInterfaces[] array
    note: >-
      Redundant rather than wrong — both shapes agree (same URL, JSONRPC, 1.0) — and it makes the card
      readable by 0.3 and 1.0 clients alike. Recorded because the two shapes coexist in the wild.
  - field: securitySchemes.bearer
    observed: flat OpenAPI-style object {type, scheme, bearerFormat, description}
    note: >-
      A2A 1.0.0's protobuf-JSON mapping wraps each scheme in a oneof (httpAuthSecurityScheme, ...).
      A strict 1.0 reader looking for that wrapper will not find it. No top-level security[]
      requirements array is declared either, so the card does not say which skills need the bearer
      scheme; the prose description ("Sign in for the extra skills") and the live probes do.
  - field: skills
    observed: five read-only public skills; the write surface (suggest_place, create_listing, create_event, jobs, tours) is absent from the card
    note: >-
      The card is a narrow projection. Piknik's REST contract exposes 683 operations and its MCP
      server 62 tools; the A2A surface is deliberately public-search-only, with more skills promised
      on the authenticated extended card (extendedAgentCard: true) that this pass could not read.
  - field: capabilities.extensions / signatures
    observed: absent
    note: No JWS signature block; authenticity rests on TLS to piknik.spot.
surface_relationship:
  note: >-
    Piknik publishes three agent surfaces that are NOT projections of one another. A2A: five
    read-only search skills at https://piknik.spot/api/a2a plus per-place and per-association agent
    cards at /api/agents/participant/{id}/card and /api/agents/association/{id}/card (declared in the
    OpenAPI under the "A2A Agents" tag, 47 operations). MCP: one remote server at
    https://piknik.spot/api/mcp with 62 tools, public reads anonymous and writes OAuth/PAT-gated (see
    mcp/piknik-spot-mcp.yml). REST: 683 operations under https://piknik.spot/api, including the A2A
    endpoint itself as POST /a2a and the MCP endpoint as POST /mcp, so both agent surfaces are
    first-class parts of the published OpenAPI rather than side channels.
