  description: Document the rate limit observed live (30 req/min with X-RateLimit-* headers) and the published caps.
  update:
    x-rate-limit:
      limit: 30
      window: 1 minute
      headers:
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
    parameters:
    - name: id
      in: query
      schema:
        type: string
    - name: q
      in: query
      schema:
        type: string
    - name: lat
      in: query
      schema:
        type: number
    - name: lng
      in: query
      schema:
        type: number
    - name: radius_km
      in: query
      schema:
        type: number
        maximum: 50
    - name: limit
      in: query
      schema:
        type: integer
        maximum: 5
    - name: role
      in: query
      schema:
        type: string
