discrepancies:
- The GET /api/mcp status document lists four "public" tools — search_agents, get_agent_card, execute_agent_capability,
  get_agent_search_history — that do NOT appear in the live tools/list (62 tools). Either they are served
  by a separate agent-directory server or the status document is stale; recorded, not resolved.
- The provider-published MCP SKILL.md table names a subset of tools; the live tools/list is the authoritative
  inventory and is what this manifest records.
- The 683-operation OpenAPI declares the MCP endpoint (POST /mcp, GET /mcp/sse, token endpoints) under
  the "MCP" / "AI Agents" tags but carries no operationIds anywhere, so the crosswalk binds tools to METHOD
  /path pairs instead.
