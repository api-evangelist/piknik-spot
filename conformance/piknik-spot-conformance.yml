  - id: mcp-authorization-spec
    conforms: true
    evidence: MCP authorization flow as specified — RFC 9728 protected-resource discovery via WWW-Authenticate resource_metadata, RFC 8414 AS metadata, PKCE, dynamic client registration — all observed live on 2026-09-19.
