      - name: level
        in: query
        schema:
          type: string
        description: level parameter
      - name: participantId
        in: query
        schema:
          type: string
        description: Participant identifier
      - name: anonymousUserId
        in: query
        schema:
          type: string
        description: anonymousUserId parameter
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      operationId: postGamesMatch3Scores
      x-operation-id-source: derived
    get:
      summary: POST - Submit a new Match3 score
      tags:
