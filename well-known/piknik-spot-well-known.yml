source: live probes of the closed /.well-known/ path list on every host the record knows, 2026-09-19
summary: >-
  Four real documents are served, all on the apex host piknik.spot, which is also the API host, the
  MCP resource server and the OAuth authorization server (issuer https://piknik.spot): an A2A agent
  card at both the canonical and the legacy path (byte-identical, content-type application/a2a+json),
  RFC 8414 authorization-server metadata and RFC 9728 protected-resource metadata (resource
  https://piknik.spot/api/mcp). The provider additionally publishes a non-standard
  /.well-known/agent-ethics.md usage policy, saved because llms.txt, robots.txt and the terms of
  service all bind agents to it. Nothing else is served: no security.txt (so NO SecurityTxt pointer),
  no api-catalog, no openid-configuration, no ai-plugin.json, no ucp/acp/aauth documents, and no
  apis.json at any of the three locations.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the OAuth discovery documents and the agent card
  (four 200s carrying real JSON/markdown documents). SecurityTxt pointer NOT emitted — RFC 9116 is
  unimplemented at /.well-known/security.txt and /security.txt.
host_set_note: >-
  piknik.spot is the only host: www.piknik.spot has no DNS A record (curl exit 6), the OpenAPI
  servers[] production entry is https://piknik.spot/api (the second entry is http://localhost:3000),
  the MCP endpoint is https://piknik.spot/api/mcp on the same host, and the protected-resource
  document names https://piknik.spot itself as the sole authorization server, so there is no third
  host to probe. No mcp./api./docs. subdomains resolve.
false_positive_watch: >-
  The Next.js app answers every unknown path with a real HTTP 404 and a ~28 KB HTML not-found page,
  so misses below are genuine 404s, not SPA soft-200s. /api returns 200 only after a 307 to
  /auth/signin?callbackUrl=%2Fapi, a login page, recorded as a miss for discovery purposes.
